<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <radialGradient id="sealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48BE70" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1D7A4C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0D11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sealBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79E5A3" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2FA766" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#12623A" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Background Glow & Seal Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#sealGlow)"/>
  <circle cx="80" cy="80" r="74" stroke="url(#sealBorder)" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="80" cy="80" r="66" stroke="#48BE70" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Outer Seal Details -->
  <circle cx="80" cy="80" r="58" fill="#12171D" stroke="url(#sealBorder)" stroke-width="1.5"/>
  
  <!-- NEXUS Toad Logo -->
  <g transform="translate(48, 48) scale(2)">
    <circle cx="9" cy="9" r="5" fill="#62D98A"/>
    <circle cx="23" cy="9" r="5" fill="#62D98A"/>
    <path d="M4 14c0-5 5-9 12-9s12 4 12 9v4c0 6-5 10-12 10S4 24 4 18v-4Z" fill="#62D98A"/>
    <circle cx="9" cy="9" r="1.7" fill="#08100B"/>
    <circle cx="23" cy="9" r="1.7" fill="#08100B"/>
    <path d="M10 19c2.8 2.1 9.2 2.1 12 0" stroke="#08100B" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
